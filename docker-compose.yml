# Dokploy deployment: Traefik routes the configured domains to port 8080
# over dokploy-network; no ports are published on the host.
services:
  proxy:
    build: .
    restart: unless-stopped
    environment:
      - PROXY_DOMAIN=${PROXY_DOMAIN:-social.eazy.kz}
      - PROXY_SCHEME=${PROXY_SCHEME:-https}
      # PO-token provider bypasses YouTube's datacenter-IP bot wall without
      # needing account cookies.
      - YTDLP_POT_BASE_URL=http://bgutil-provider:4416
      # Authenticated cookies are the reliable bypass on a flagged VPS IP.
      # Reuse the save-video-bot cookies file (single source of truth); the
      # app copies it to a writable temp so yt-dlp can rotate it.
      - YTDLP_COOKIES=/app/cookies.txt
      # Route yt-dlp extraction through the home IP: YouTube refuses this
      # datacenter IP even with cookies. Reuses save-video-bot's wg-home
      # WireGuard→tinyproxy tunnel (shared via its external network below).
      - YTDLP_PROXY=http://wg-home:8888
    volumes:
      - /etc/dokploy/compose/save-video-bot-i0chzg/files/cookies.txt:/app/cookies.txt:ro
    expose:
      - "8080"
    networks:
      - default
      - dokploy-network
      - botnet
    depends_on:
      - bgutil-provider

  # Generates YouTube PO tokens for yt-dlp (no login required).
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    expose:
      - "4416"
    networks:
      - default

networks:
  default:
  dokploy-network:
    external: true
  # save-video-bot's compose network, for its wg-home tinyproxy (home IP).
  botnet:
    external: true
    name: save-video-bot-i0chzg_default
