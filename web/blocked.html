<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заблокировано</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280; --border: #e5e7eb; --accent: #4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --card: #1a1e24; --text: #e8eaed; --muted: #9aa2ad; --border: #2a2f37; --accent: #818cf8; }
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); padding: 24px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 420px; padding: 32px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  }
  .icon { font-size: 48px; }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🚫</div>
    <h1>Этот раздел заблокирован</h1>
    <p>Короткие видео ({{.SiteLabel}}) отключены на этом прокси. Обычные видео, поиск и каналы доступны.</p>
    <a href="{{.PortalURL}}">← Вернуться на портал</a>
  </div>
</body>
</html>
